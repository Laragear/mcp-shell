name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for npm provenance / OIDC.

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          scope: "@laragear"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies npm in CI/CD
        run: npm ci

      - name: Set package version
        if: github.event.release.tag_name
        run: npm version ${{ github.event.release.tag_name }} --no-git-tag-version --allow-same-version

      # prepublishOnly runs lint + test (which builds), and prepack rebuilds
      # the mcp/ output that ships in the tarball.
      - name: Publish package to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
